name: ZenMail Pro - Cleanup Old Emails

on:
  # Run every hour
  schedule:
    - cron: '0 * * * *'

  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Cleanup Old Emails
        run: node scraper.js cleanup
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-logs
          path: |
            *.log
          retention-days: 1
