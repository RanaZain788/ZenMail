name: Zenmail Ninja Scraper
on:
  repository_dispatch:
    types: [manual_trigger]  # Website se signal ayega
  schedule:
    - cron: '*/5 * * * *'    # Har 5 min baad OTP check karne ke liye
  workflow_dispatch:         # Button click ke liye

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run Scraper
        run: node scraper.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
