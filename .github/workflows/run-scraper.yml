name: ZenMail Pro - 24/7 Email Scraper

on:
  # Run every 6 minutes to pre-scrape emails
  schedule:
    - cron: '*/6 * * * *'

  # Run cleanup every hour
    - cron: '0 * * * *'

  # Manual triggers
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scraper Mode'
        required: true
        default: 'pre_scrape'
        type: choice
        options:
          - pre_scrape
          - cleanup
          - assign
          - check_otp
      userId:
        description: 'User ID (for assign/check_otp modes)'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          # Install Chrome dependencies for Puppeteer
          sudo apt-get update
          sudo apt-get install -y             libnss3             libatk-bridge2.0-0             libxss1             libgtk-3-0             libgbm-dev             libasound2

      - name: Run Pre-Scrape (Every 6 min)
        if: github.event.inputs.mode == 'pre_scrape' || github.event.inputs.mode == ''
        run: node scraper.js pre_scrape
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        continue-on-error: true

      - name: Run Cleanup (Hourly)
        if: github.event.inputs.mode == 'cleanup'
        run: node scraper.js cleanup
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        continue-on-error: true

      - name: Assign Email to User
        if: github.event.inputs.mode == 'assign'
        run: node scraper.js assign ${{ github.event.inputs.userId }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Check OTP
        if: github.event.inputs.mode == 'check_otp'
        run: node scraper.js check_otp ${{ github.event.inputs.userId }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs
          path: |
            *.log
            npm-debug.log*
          retention-days: 1
