- name: Install Dependencies
        run: |
          npm install
          # Isse Puppeteer ko bolo ke Chrome download mat kare, hum system wala use karenge
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

      - name: Run Scraper
        run: node scraper.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome  # System Chrome ka rasta
